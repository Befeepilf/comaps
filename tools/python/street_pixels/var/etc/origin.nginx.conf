# Street Pixels public origin (SP-102). Placeholder only.
# server_name is the SP-101 template (maps.example.invalid). The live
# hostname is ops — do not commit it.
# Document root = parent of maps/ and meta/ (SP-050 --out).
# Range is nginx default for static files. gzip is off so SHA of
# .mwm / .spa / .sig / countries.txt matches the client.
# Do not enable serve_spa_publish_tree --enable-debug-routes here.

server {
    listen 80;
    listen [::]:80;
    server_name maps.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name maps.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/maps.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maps.example.invalid/privkey.pem;

    root /var/www/street-pixels;
    autoindex off;

    gzip off;
    gzip_static off;
    gzip_vary off;

    types {
        application/octet-stream mwm spa sig diff;
        application/json json txt;
    }
    default_type application/octet-stream;

    location = /inventory.json {
        return 404;
    }

    location / {
        try_files $uri =404;
    }
}
